name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bundle protocol into integration
        run: |
          rm -rf custom_components/somfy_rts/protocol
          cp -r somfy_rts_protocol custom_components/somfy_rts/protocol

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: somfy_rts.zip
          generate_release_notes: true