name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  test-decoder:
    name: Decoder smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf '[I][remote.raw:026]: Received Raw: 2457, -2505, 2465, -2502, 4714, -1243, 1248, -1261, 1265, -613, 618, -643, 622, -615, 638, -1233, 636, -615, 1277, -1246, 624, -624, 623, -623, 624, -610, 634, -614, 1269, -1239, 1268, -1249, 1239, -636, 618, -1246, 1276, -621, 624, -627, 616, -642, 629, -611, 641, -1220, 1279, -1251, 616, -615, 1252, -1245, 1265, -620, 637, -620, 634, -614, 642, -622, 617, -639, 610, -1246, 641, -604, 1267, -641, 613, -624, 630, -621, 636, -620, 634, -1239, 640, -622, 612, -632, 1261, -1230, 1266, -1252, 1250, -1242, 1259' | python3 docs/decode_capture.py | grep '0x970229'